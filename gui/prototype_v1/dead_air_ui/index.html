<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEAD AIR · Investigation Receiver Prototype</title><style>
:root{color-scheme:dark;--green:#80ff94;--amber:#f5a83d}*{box-sizing:border-box}body{margin:0;background:#070909;color:#9cffad;font:14px 'Courier New',monospace;display:grid;place-items:center;min-height:100vh}#rig{width:min(100vw,177.68vh);aspect-ratio:1672/941;position:relative;background:url('assets/reference_master.png') center/100% 100% no-repeat;overflow:hidden;user-select:none}#rig .hit{position:absolute;background:transparent;border:1px solid transparent;cursor:pointer;color:transparent}#rig .hit:hover,#rig .hit:focus-visible{outline:none;border-color:rgba(152,255,155,.78);background:rgba(65,255,90,.09);box-shadow:inset 0 0 18px #27f05a44}#rig .hit:active{background:#4fff8a35}.screen{position:absolute;background:#020d07;color:var(--green);border:1px solid #267b43;box-shadow:inset 0 0 14px #000,0 0 5px #041;overflow:hidden}#wf{left:30.6%;top:14.5%;width:37.4%;height:37.6%;pointer-events:none;opacity:.96}#wfcanvas{display:block;width:100%;height:100%}#status{left:31.1%;top:10.9%;width:39%;height:3%;background:#06140b;display:flex;align-items:center;justify-content:space-around;font-size:clamp(6px,1vw,16px);white-space:nowrap}#case{left:17.85%;top:21.2%;width:10.1%;height:19%;padding:1%;font-size:clamp(5px,.88vw,14px);line-height:1.65}#case strong{color:#c5ffd0}#case small{color:#719c81}#digital{left:77.5%;top:68.8%;width:13.2%;height:4.5%;display:grid;place-items:center;font-size:clamp(9px,2vw,28px);font-weight:600}#toast{z-index:12;position:absolute;left:36%;top:78%;width:33%;padding:1%;background:#04120eee;border:1px solid #6bd487;opacity:0;transition:opacity .2s;text-align:center;color:#caffc7;pointer-events:none}#toast.show{opacity:1}#overlay{z-index:20;position:absolute;inset:9% 19% 21% 17%;background:#07110fee;border:2px solid #527661;box-shadow:0 0 0 400px #0009,0 6px 45px #000;display:none;padding:2.3%;overflow:auto}#overlay.show{display:block}#overlay h2{font-size:clamp(13px,2vw,24px);margin:0 0 12px;color:#c1ffcb}#overlay p,#overlay li{font-size:clamp(9px,1.2vw,16px);line-height:1.6}#overlay button{background:#1a2f24;border:1px solid #63866b;padding:8px 14px;color:#d7ffd5;cursor:pointer}#overlay .close{float:right}#overlay table{border-collapse:collapse;width:100%;font-size:clamp(8px,1.1vw,14px)}#overlay td,#overlay th{text-align:left;border-bottom:1px solid #42604b;padding:8px}#overlay input,#overlay textarea{background:#06160d;color:#ccffdc;border:1px solid #54755b;padding:8px;max-width:100%}#overlay textarea{width:100%;height:100px}#notice{position:absolute;bottom:1%;right:1%;background:#000b;padding:5px 9px;color:#a7b9aa;font-size:clamp(7px,.8vw,12px)}
</style></head><body><main id="rig" aria-label="DEAD AIR physical radio workstation prototype"><div id="status" class="screen"><span id="rx">RX OFF</span><span id="freqTop">7.120.000 MHz</span><span id="modeTop">LSB</span><span id="bandTop">HF</span><span id="gainTop">GAIN 50%</span></div><div id="wf" class="screen"><canvas id="wfcanvas"></canvas></div><div id="case" class="screen"><strong>NRMS / SITE 04</strong><hr style="border-color:#205b33"><div>SHIFT MONITOR</div><div id="caseState">Receiver inactive</div><div>Archive: <b>0 records</b></div><div>Open reports: <b>1</b></div><small>Routine monitoring duty</small></div><div id="digital" class="screen">7.120.000</div><div id="toast" aria-live="polite"></div><section id="overlay" aria-modal="true" role="dialog"><button class="close" onclick="closePanel()">CLOSE ×</button><div id="panelContent"></div></section><div id="notice">INTERACTIVE LAYOUT PROTOTYPE · NOT FINAL GAME SIMULATION</div></main><script>
const rig=document.querySelector('#rig'), wf=document.querySelector('#wfcanvas');let on=false,frequency=7.12, mode='LSB',band='HF',step=.0001,gain=50,af=50,squelch=25,recording=false,held=false,waterfallMode='LIVE',scan=false,notes='',records=[],tick=0;const modes=['AM','FM','NFM','USB','LSB','CW'];const bandStart={HF:7.12,VHF:146.73,UHF:433.92};const signals={HF:[7.1183,7.12,7.1232,7.1261],VHF:[146.725,146.73,146.735],UHF:[433.915,433.92]};function fmt(){return frequency.toFixed(6)}function sync(){document.querySelector('#rx').textContent=on?'RX ON':'RX OFF';document.querySelector('#freqTop').textContent=fmt()+' MHz';document.querySelector('#modeTop').textContent=mode;document.querySelector('#bandTop').textContent=band;document.querySelector('#gainTop').textContent='GAIN '+gain+'%';document.querySelector('#digital').textContent=fmt();document.querySelector('#caseState').textContent=on?'Monitor active':'Receiver inactive';document.querySelector('#case b').textContent=records.length+' records'}function msg(t){let x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');clearTimeout(msg.timer);msg.timer=setTimeout(()=>x.classList.remove('show'),1600)}function tune(d){if(!on){msg('POWER ON RECEIVER FIRST');return}frequency=Math.max(band==='HF'?3:band==='VHF'?30:300,Math.min(band==='HF'?30:band==='VHF'?300:3000,frequency+d));sync()}function add(x,y,w,h,title,fn){let b=document.createElement('button');b.className='hit';b.title=title;b.setAttribute('aria-label',title);b.style.left=(x/1672*100)+'%';b.style.top=(y/941*100)+'%';b.style.width=(w/1672*100)+'%';b.style.height=(h/941*100)+'%';b.onclick=fn;rig.appendChild(b)}function panel(name,html){document.querySelector('#panelContent').innerHTML='<h2>'+name+'</h2>'+html;document.querySelector('#overlay').classList.add('show')}function closePanel(){document.querySelector('#overlay').classList.remove('show')}window.closePanel=closePanel;function panelFor(id){let pages={RADIO:`<p>Receiver status: ${on?'ACTIVE':'OFFLINE'}</p><p>Band: ${band} · Mode: ${mode} · Frequency: ${fmt()} MHz</p><p>Tap the tuner or use the mouse wheel over the tuning dial for frequency changes. Tap band label to change band. Power toggles via the upper-left radio selector.</p><button onclick="setBand()">CHANGE BAND</button> <button onclick="power()">POWER ON/OFF</button>`, 'CASE FILES':`<p><b>Monitoring Site 04 — Assigned Shift</b></p><p>Institutional reports and discrepancy investigations appear here. Example lead: unidentified identifier <b>NR-041</b>, registry status unresolved.</p><p>This is placeholder prototype content, not a finalized case script.</p>`,EVIDENCE:`<table><tr><th>ID</th><th>Kind</th><th>Source</th></tr><tr><td>SIG-0042</td><td>Signal observation</td><td>Receiver</td></tr><tr><td>NR-041</td><td>Identifier</td><td>Provisional / unverified</td></tr></table><p>Original records, corrections, and contradictions will remain separately visible.</p>`,RECORDINGS:`<p>${records.length} local recording(s) in this prototype.</p><ul>${records.map(r=>'<li>'+r+'</li>').join('')||'<li>No recordings yet</li>'}</ul>`,TIMELINE:`<p>Each recovered record retains separate timestamps for claimed event, creation, receipt, and archive ingestion/correction.</p><p>Conflicting timestamps are preserved instead of silently resolved.</p>`,MAP:`<p>Location records and facility references will be linked to official sources; exact map contents remain to be established.</p>`,ARCHIVE:`<p>Searchable official records by frequency, date, mode, station ID, classification and status.</p><p>Record corrections are linked and versioned; official history is never overwritten.</p>`,NOTES:`<p>Private technician notebook</p><textarea id="memo" placeholder="Write observations, questions, hypotheses...">${notes.replace(/</g,'&lt;')}</textarea><p><button onclick="saveNotes()">SAVE NOTE</button></p>`,ANALYZE:`<p>Technical measurement panel</p><table><tr><td>Frequency</td><td>${fmt()} MHz</td></tr><tr><td>Mode</td><td>${mode}</td></tr><tr><td>Receiver gain</td><td>${gain}%</td></tr><tr><td>Squelch</td><td>${squelch}%</td></tr><tr><td>Signal status</td><td>${on?'Monitoring':'No receiver power'}</td></tr></table><p>Decoder confidence will indicate readability, not whether a source's claim is true.</p>`,MARK:`<p>Provisional observation <b>SIG-${String(records.length+42).padStart(4,'0')}</b> added to private records.</p>`};panel(id,pages[id]||'<p>Panel pending integration.</p>')}window.saveNotes=()=>{notes=document.querySelector('#memo').value;localStorage.setItem('dead_air_notes',notes);msg('PRIVATE NOTES SAVED');closePanel()};window.power=()=>{on=!on;sync();msg(on?'RECEIVER ONLINE':'RECEIVER OFFLINE');closePanel()};window.setBand=()=>{band=band==='HF'?'VHF':band==='VHF'?'UHF':'HF';frequency=bandStart[band];sync();closePanel();msg('BAND '+band)};notes=localStorage.getItem('dead_air_notes')||'';
const nav=['RADIO','CASE FILES','EVIDENCE','RECORDINGS','TIMELINE','MAP','ARCHIVE','NOTES'];nav.forEach((n,i)=>add(102,158+57*i,165,51,n,()=>n==='RADIO'?power():panelFor(n)));
const modeXY=[[321,628,'AM'],[321,653,'LSB'],[321,676,'USB'],[321,698,'CW'],[321,719,'FM']];modeXY.forEach(([x,y,m])=>add(x,y,106,23,'Mode '+m,()=>{mode=m;sync();msg('MODE '+m)}));add(315,590,118,29,'Cycle receiver modes',()=>{mode=modes[(modes.indexOf(mode)+1)%modes.length];sync();msg('MODE '+mode)});
add(496,603,108,104,'SCAN / SEEK',()=>{if(!on)return msg('POWER ON FIRST');let a=signals[band].filter(f=>f>frequency+0.000001);frequency=a.length?a[0]:signals[band][0];sync();msg('SEEK: SIGNAL FOUND')});add(616,603,104,101,'HOLD waterfall',()=>{held=!held;msg(held?'WATERFALL HELD':'WATERFALL LIVE')});add(731,603,106,102,'Record transmission',()=>{if(!on)return msg('POWER ON FIRST');recording=!recording;if(!recording)records.push('REC-'+String(records.length+1).padStart(4,'0')+' · '+fmt()+' MHz · '+mode);sync();msg(recording?'RECORDING…':'RECORDING SAVED')});add(851,601,111,109,'Mark signal',()=>{records.push('MARK · '+fmt()+' MHz');sync();panelFor('MARK')});add(965,605,111,108,'Analyze signal',()=>panelFor('ANALYZE'));add(1271,368,218,214,'Large frequency tuning knob',()=>{tune(step);msg('TUNE +'+step+' MHz')});add(1266,243,78,79,'RF gain',()=>{gain=(gain+10)%110;sync();msg('RF GAIN '+gain+'%')});add(1387,244,82,79,'Audio volume',()=>{af=(af+10)%110;msg('AF GAIN '+af+'%')});add(1515,243,85,79,'Squelch',()=>{squelch=(squelch+10)%110;msg('SQUELCH '+squelch+'%')});[[1518,385,.01,'10 kHz'],[1518,432,.001,'1 kHz'],[1518,480,.0001,'100 Hz'],[1518,528,.00001,'10 Hz']].forEach(([x,y,v,t])=>add(x,y,90,40,'Tuning step '+t,()=>{step=v;msg('STEP '+t)}));[['LIVE',604],['HISTORY',635],['PEAK',665],['AVERAGE',695]].forEach(([m,y])=>add(1102,y,114,26,'Waterfall '+m,()=>{waterfallMode=m;msg('WATERFALL '+m)}));add(515,100,150,32,'Toggle receiver band',setBand);add(670,100,140,32,'Cycle modulation mode',()=>{mode=modes[(modes.indexOf(mode)+1)%modes.length];sync();msg('MODE '+mode)});add(805,100,140,32,'Bandwidth settings',()=>panel('BANDWIDTH','<p>Narrowing the filter improves isolation but may remove detail. Full interactive filter is scheduled for game integration.</p>'));add(948,100,112,32,'Automatic gain control',()=>msg('AGC SETTING'));add(1058,100,110,32,'Noise reduction',()=>msg('NOISE REDUCTION SETTING'));add(291,193,174,35,'Monitoring Site 04 case file',()=>panelFor('CASE FILES'));
rig.addEventListener('wheel',e=>{let r=rig.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;if(x>.73&&x<.91&&y>.35&&y<.65){e.preventDefault();tune((e.deltaY<0?1:-1)*step)}},{passive:false});window.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();if(e.key==='ArrowRight')tune(step);if(e.key==='ArrowLeft')tune(-step)});
let ctx=wf.getContext('2d');function draw(){let w=wf.width=650,h=wf.height=330,img=ctx.createImageData(w,h),d=img.data;tick++;for(let y=0;y<h;y++)for(let x=0;x<w;x++){let i=(y*w+x)*4,baseline=on?Math.random()*18:0,trace=0;if(on){for(const c of [87,210,362,444,528]){let dx=Math.abs(x-c),amp=Math.max(0,1-dx/24);trace+=amp*(18+Math.random()*87)*(0.65+0.35*Math.sin((y+tick)*.027+x*.04))}baseline+=Math.random()*16};let p=Math.min(255,baseline+trace);d[i]=p*.32;d[i+1]=p;d[i+2]=p*.42;d[i+3]=255}ctx.putImageData(img,0,0);ctx.strokeStyle='#3c9e59aa';ctx.lineWidth=1;for(let x=0;x<w;x+=65){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}setTimeout(draw,120)}sync();draw();
</script></body></html>
