'use strict'; const $=s=>document.querySelector(s), rig=$('#rig');let st={power:true,band:'HF',mode:'LSB',hz:7120000,step:100,gain:55,volume:55,squelch:24,filter:2400,scan:false,hold:false,rec:false,recStart:null,wfMode:'LIVE',notes:'',logs:[],seq:0,agc:true,nb:true};const bands={HF:{min:3000000,max:30000000,home:7120000,signals:[{hz:7118600,p:0.42,type:'carrier'},{hz:7120000,p:.84,type:'voice'},{hz:7123300,p:.55,type:'data'},{hz:7126200,p:.35,type:'carrier'},{hz:7418000,p:.62,type:'carrier'}]},VHF:{min:30000000,max:300000000,home:146730000,signals:[{hz:146725000,p:.48,type:'voice'},{hz:146730000,p:.82,type:'voice'},{hz:146735000,p:.5,type:'carrier'}]},UHF:{min:300000000,max:3000000000,home:433920000,signals:[{hz:433915000,p:.48,type:'data'},{hz:433920000,p:.75,type:'voice'}]}};const modes=['AM','LSB','USB','CW','FM','NFM'];const key='dead_air_receiver_v2';try{let saved=JSON.parse(localStorage.getItem(key)||'{}');st.notes=typeof saved.notes==='string'?saved.notes:'';st.logs=Array.isArray(saved.logs)?saved.logs:[]}catch{}function save(){try{localStorage.setItem(key,JSON.stringify({notes:st.notes,logs:st.logs}))}catch{}}function fmt(h=st.hz){return (h/1e6).toFixed(6)}function notify(t){let n=$('#toast');n.textContent=t;n.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>n.classList.remove('show'),1400)}function nearest(){let a=bands[st.band].signals;return a.reduce((best,s)=>Math.abs(s.hz-st.hz)<Math.abs(best.hz-st.hz)?s:best)}function quality(){if(!st.power)return 0;let n=nearest(),dist=Math.abs(st.hz-n.hz),width=Math.max(150,st.filter/2);return Math.max(0,n.p*(1-dist/(width*3)))*(st.gain/100)}function tune(steps){if(!st.power)return notify('RECEIVER OFFLINE');if(st.rec)finishMetadataRecording('INTERRUPTED_TUNE');let b=bands[st.band];st.hz=Math.min(b.max,Math.max(b.min,st.hz+Math.round(steps)*st.step));st.seq++;sync()}function bandChange(){if(st.rec)finishMetadataRecording('INTERRUPTED_BAND');let options=Object.keys(bands);st.band=options[(options. const radioModes=[['AM',627],['LSB',653],['USB',677],['CW',699],['FM',723]];radioModes.forEach(([mode,y])=>hit(mode,314,y,118,22,()=>setMode(mode)));hit('POWER',291,157,184,38,()=>{if(st.power&&st.rec)finishMetadataRecording('INTERRUPTED_POWER_OFF');st.power=!st.power;st.scan=false;sync();notify(st.power?'RECEIVER ONLINE':'RECEIVER OFFLINE')});hit('SCAN',499,606,103,102,()=>{if(!st.power)return notify('POWER OFF');let a=bands[st.band].signals,found=a.find(s=>s.hz>st.hz+st.step);st.hz=(found||a[0]).hz;st.seq++;sync();notify('SEEK LOCK · SIMULATED')});hit('HOLD',617,605,106,101,()=>{st.hold=!st.hold;sync();notify(st.hold?'WATERFALL HELD':'WATERFALL LIVE')});hit('RECORD',732,604,108,104,()=>{if(!st.power)return notify('POWER OFF');if(!st.rec){st.rec=true;st.recStart=new Date().toISOString();notify('METADATA RECORDING STARTED — NO AUDIO')}else{finishMetadataRecording('COMPLETE');notify('RECORDING METADATA SAVED')}sync()});hit('MARK',851,605,111,104,()=>{if(!st.power)return notify('POWER OFF');log('SIGNAL MARK',{quality:quality(),band:st.band});notify('OBSERVATION MARKED')});hit('ANALYZE',970,605,109,104,()=>nav('ANALYZE'));

function openQuickControls(){show('LARGE TOUCH CONTROLS','<p>These buttons provide an accessible alternative to the illustrated hardware. RECORD saves metadata only, not audio.</p><p id="quickState"></p><div id="quickPanel"><button id="qPower">POWER</button><button id="qBand">BAND</button><button id="qMode">MODE</button><button id="qStep">STEP</button><button id="qDown">TUNE −</button><button id="qUp">TUNE +</button><button id="qScan">SEEK</button><button id="qHold">HOLD</button><button id="qRecord">RECORD</button><button id="qMark">MARK</button><button id="qAnalyze">ANALYZE</button><button id="qNotes">NOTES</button></div>');
 const actions={qPower:()=>document.querySelector('.hit[data-name="POWER"]').click(),qBand:bandChange,qMode:()=>setMode(modes[(modes.indexOf(st.mode)+1)%modes.length]),qStep:()=>{let steps=[10,100,1000,10000];st.step=steps[(steps.indexOf(st.step)+1)%steps.length];sync()},qDown:()=>tune(-1),qUp:()=>tune(1),qScan:()=>document.querySelector('.hit[data-name="SCAN"]').click(),qHold:()=>document.querySelector('.hit[data-name="HOLD"]').click(),qRecord:()=>document.querySelector('.hit[data-name="RECORD"]').click(),qMark:()=>document.querySelector('.hit[data-name="MARK"]').click(),qAnalyze:()=>nav('ANALYZE'),qNotes:()=>nav('NOTES')};
 for(let [id,action] of Object.entries(actions)){document.getElementById(id).addEventListener('click',()=>{action();if($('#quickState'))$('#quickState').textContent='Receiver '+(st.power?'ON':'OFF')+' · '+fmt()+' MHz · '+st.mode+' · Step '+st.step+' Hz · '+(st.rec?'Recording metadata':'Not recording')})}

function dragKnob(id,field){let el=$('#'+id), last=0;el.addEventListener('pointerdown',e=>{last=e.clientY;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!el.hasPointerCapture(e.pointerId))return;let amount=(last-e.clientY)/3;if(Math.abs(amount)>=1){st[field]=Math.min(100,Math.max(0,st[field]+Math.round(amount)));last=e.clientY;sync()}});el.addEventListener('wheel',e=>{e.preventDefault();st[field]=Math.min(100,Math.max(0,st[field]+(e.deltaY<0?2:-2)));sync()},{passive:false});el.addEventListener('keydown',e=>{if(['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key)){e.preventDefault();st[field]=Math.min(100,Math.max(0,st[field]+(['ArrowUp','ArrowRight'].includes(e.key)?1:-1)));sync()}})}[['rfKnob','gain'],['afKnob','volume'],['sqKnob','squelch']].forEach(([id,f])=>dragKnob(id,f));let dial=$('#dial'),lastDial=null;dial.addEventListener('pointerdown',e=>{lastDial=[e.clientX,e.clientY];dial.setPointerCapture(e.pointerId)});dial.addEventListener('pointermove',e=>{if(!dial.hasPointerCapture(e.pointerId)||!lastDial)return;let delta=(e.clientX-lastDial[0])+(lastDial[1]-e.clientY);if(Math.abs(delta)>=3){tune(Math.trunc(delta/3));lastDial=[e.clientX,e.clientY]}});dial.addEventListener('pointerup',()=>lastDial=null);dial.addEventListener('wheel',e=>{e.preventDefault();tune(e.deltaY<0?1:-1)},{passive:false});dial.addEventListener('keydown',e=>{if(['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key)){e.preventDefault();tune(['ArrowUp','ArrowRight'].includes(e.key)?1:-1)}});window.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('show');if(e.defaultPrevented||$('#modal').classList.contains('show'))return;let active=document.activeElement;if(['ArrowRight','ArrowLeft'].includes(e.key)&&!['TEXTAREA','INPUT','SELECT'].includes(active.tagName)&&active!==dial&&active.getAttribute('role')!=='slider'&&active.tagName!=='BUTTON')tune(e.key==='ArrowRight'?1:-1)});
// Deterministic RF synthesizer: signals follow tuning and band, no invented live received content.
const wf=$('#wf'),ctx=wf.getContext('2d',{alpha:false}),wave=$('#waveCanvas'),wctx=wave.getContext('2d');let t=0,last=performance.now();let waterfall=ctx.createImageData(wf.width,wf.height);function rfAt(x,now){let span=st.band==='HF'?18000:st.band==='VHF'?26000:32000,hz=st.hz+((x/wf.width)-.5)*span;let z=.035;for(let [i,s] of bands[st.band].signals.entries()){let width=s.type==='carrier'?90:s.type==='data'?480:750,d=(hz-s.hz)/width;z+=s.p*Math.exp(-d*d*2)*(s.type==='voice'?(0.72+.28*Math.sin(now/370+i*4)):(s.type==='data'?(Math.sin(now/190+i*20)>0?.95:.2):1))}return z*st.gain/90}function row(){let w=wf.width,h=wf.height,dat=waterfall.data;if(!st.hold){dat.copyWithin(w*4,w*4*0,w*4*(h-1));let now=performance.now();for(let x=0;x<w;x++){let a=st.power?rfAt(x,now):0;let noise=st.power?(Math.sin(x*19.2+t*.31)*.018+.04):0;let v=Math.min(1,Math.max(0,a+noise));let idx=x*4;dat[idx]=Math.floor(12+v*108);dat[idx+1]=Math.floor(17+v*238);dat[idx+2]=Math.floor(11+v*75);dat[idx+3]=255}ctx.putImageData(waterfall,0,0);if(st.wfMode==='PEAK')ctx.fillStyle='#a8ff8714';else if(st.wfMode==='AVERAGE')ctx.fillStyle='#1b402222';else ctx.fillStyle='#00000008';ctx.fillRect(0,0,w,h)}let ww=wave.width,hh=wave.height;wctx.fillStyle='#021009';wctx.fillRect(0,0,ww,hh);wctx.strokeStyle='#65ff87';wctx.lineWidth=1.4;wctx.beginPath();let q=quality(),squelched=q*100<st.squelch/2;for(let i=0;i<ww;i++){let v=(!st.power||squelched)?0:Math.sin(i*.19+t*.37)*Math.sin(i*.04+t*.09)*q*hh*.35;let yy=hh*.5+v;if(i===0)wctx.moveTo(i,yy);else wctx.lineTo(i,yy)}wctx.stroke();t++;if(performance.now()-last>130){sync();last=performance.now()}setTimeout(row,100)}sync();row();
