name: Android debug export

on:
  workflow_dispatch:
  push:
    paths:
      - "export_presets.cfg"
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - ".github/workflows/android-export.yml"

permissions:
  contents: read

jobs:
  android-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Godot 4.3
        shell: bash
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Install matching Godot export templates
        shell: bash
        run: |
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p /tmp/godot-template-package
          unzip -q templates.tpz -d /tmp/godot-template-package
          cp /tmp/godot-template-package/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Configure Godot Android editor paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Generate temporary CI signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/dead-air-ci.keystore" -alias dead-air-ci -keyalg RSA -keysize 2048 -validity 10000 -storepass dead-air-ci-password -keypass dead-air-ci-password -dname "CN=DEAD AIR CI, OU=Build, O=Dead Air, L=Unknown, ST=Unknown, C=US"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/dead-air-ci.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=dead-air-ci" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=dead-air-ci-password" >> "$GITHUB_ENV"
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/dead-air-debug.apk
          test -s build/dead-air-debug.apk
          stat -c "Debug APK size: %s bytes" build/dead-air-debug.apk
      - name: Export CI-signed release APK
        run: |
          godot --headless --verbose --path . --export-release "Android" build/dead-air-ci-release.apk
          test -s build/dead-air-ci-release.apk
          stat -c "CI-signed release APK size: %s bytes" build/dead-air-ci-release.apk
      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: dead-air-android-apks
          path: |
            build/dead-air-debug.apk
            build/dead-air-ci-release.apk
          if-no-files-found: error
          retention-days: 14
